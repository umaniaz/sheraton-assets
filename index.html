<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sheraton Assets Register</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#1c3042;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#17324b;color:white;padding:20px max(18px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:21px;margin:0}header small{color:#bdd0df}.shell{max-width:1100px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{background:white;color:#17324b;border:1px solid #dce5ee}.tabs button.active{background:#17324b;color:white}button{border:0;border-radius:9px;padding:11px 15px;font-weight:650;cursor:pointer;background:#246d91;color:white}button.secondary{background:#e8eef4;color:#193a50}button.danger{background:#fff0ef;color:#a12d2d}button:disabled{opacity:.45;cursor:not-allowed}.panel{background:white;border:1px solid #e0e7ef;border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px #0a203008}h2{margin:0 0 12px;font-size:20px}h3{margin:12px 0}.muted{color:#637789;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{padding:18px;background:#f1f6fa;border-radius:12px}.stat b{font-size:27px;display:block}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}label{display:block;font-size:12px;font-weight:700;color:#566a79;margin-bottom:5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cdd8e1;border-radius:8px;font:inherit;background:white}textarea{min-height:65px}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f5}.line:last-child{border:0}.line strong{display:block}.line .muted{margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.pill{border-radius:20px;padding:4px 8px;font-size:11px;background:#e8eff4;color:#385c70}.notice{padding:12px;background:#fff6df;border-radius:9px;color:#6e5318;font-size:13px;margin-bottom:14px}.hidden{display:none!important}.toolbar
